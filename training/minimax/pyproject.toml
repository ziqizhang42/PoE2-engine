[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "poe2-minimax-training"
version = "0.2.0"
description = "Offline learning tools for the PoE2 minimax evaluator"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy==2.5.1",
  "torch==2.12.1",
  "tqdm==4.67.1",
  "triton-rocm==3.7.1; sys_platform == 'linux'",
]

[project.scripts]
poe2-training-smoke = "poe2_training.smoke:main"
poe2-train-baselines = "poe2_training.baseline:main"
poe2-train-patterns = "poe2_training.pattern_experiment:main"
poe2-evaluate-pattern = "poe2_training.pattern_evaluation:main"
poe2-verify-pattern-gain = "poe2_training.pattern_integration:main"
poe2-train = "poe2_training.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poe2_training"]

[tool.uv]
required-version = ">=0.12,<0.13"
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
