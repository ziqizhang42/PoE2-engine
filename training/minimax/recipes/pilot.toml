schema_version = 1

[run]
name = "pilot"
output_dir = "build/training-runs/pilot"
build_preset = "release"

# Small corpus used to compare model shapes.
[datasets.selection]
kind = "managed"

[datasets.selection.source]
corpus_id = "poe2-pilot-selection"
seed = 20260817
trajectories = 1000
samples_per_trajectory = 8
shards = 4
workers = 6
search_nodes = 10000
search_hash_mb = 16
noise_percent = 15
random_weight = 30
greedy_weight = 20
opponent_weight = 20
search_weight = 30
progress_every = 100

[datasets.selection.labels]
mode = "teacher"
nodes = 100000
hash_mb = 16
workers = 6
progress_every = 100
require_all = true

# Independent corpus used to train and evaluate the chosen shape.
[datasets.final]
kind = "managed"

[datasets.final.source]
corpus_id = "poe2-pilot-final"
seed = 20260818
trajectories = 2000
samples_per_trajectory = 8
shards = 8
workers = 6
search_nodes = 10000
search_hash_mb = 16
noise_percent = 15
random_weight = 30
greedy_weight = 20
opponent_weight = 20
search_weight = 30
progress_every = 100

[datasets.final.labels]
mode = "teacher"
nodes = 100000
hash_mb = 16
workers = 6
progress_every = 100
require_all = true

# Choose the model shape using only the selection corpus.
[[iterations]]
name = "select-model"
dataset = "selection"

[iterations.training]
type = "pattern"
device = "cuda"
seed = 20260818
suite = "default"

# Train the chosen shape on the independent final corpus.
[[iterations]]
name = "train-final-model"
dataset = "final"
depends_on = ["select-model"]

[iterations.training]
type = "pattern"
device = "cuda"
seed = 20260818
suite = "frozen-pattern-gain"

[iterations.sealed_evaluation]
exclude_datasets = ["selection"]

[iterations.candidate_validation]
promotable = false
samples = 4096
symmetry_samples = 512
benchmark_iterations = 100
opening_book = "eval/openings/pilot.txt"
search_positions = 32
search_movetime_ms = 100
