name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build, Test, Format, Tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            clang-format \
            clang-tidy \
            cmake \
            ninja-build

      - name: Check
        run: make check
