name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build, Test, Format, Tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-toolchain-noble-22.list
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            clang-format-22 \
            clang-tidy-22 \
            cmake \
            ninja-build

      - name: Check
        run: make check

  wasm:
    name: Browser WebAssembly
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:6.0.6
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        run: |
          apt-get update
          apt-get install --yes ninja-build

      - name: Configure
        run: cmake --preset wasm-release

      - name: Build
        run: cmake --build --preset wasm-release

      - name: Test
        run: ctest --preset wasm-release
